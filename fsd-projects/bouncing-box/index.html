    <meta charset="utf-8" />

    <script src="jquery.min.js"></script>
    <style>
     .box {
     width: 70px;
     height: 70px;
    background-image: url("https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/d83448a1-cfd5-42c7-ad00-49e520aaa588/d86p9di-1e58a05e-8ed8-4644-8822-c12d89414716.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi9kODM0NDhhMS1jZmQ1LTQyYzctYWQwMC00OWU1MjBhYWE1ODgvZDg2cDlkaS0xZTU4YTA1ZS04ZWQ4LTQ2NDQtODgyMi1jMTJkODk0MTQ3MTYucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.42dKBBanD4zcOY6eMyUVNRUO7WLe5sgW68RGhngDFWI");
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-color: transparent;
    border: none;
    font-size: 0;
    user-select: none;

    top: 100px;
    left: 0px;
   }

     

      .board {
        height: 100vh;
        background-image: url("https://i.pinimg.com/originals/cd/d2/2e/cdd22e5ab69bd3bc6c8865ba24bc541d.gif");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
    </style>
    <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
  </head>

  <body class="board">
    <!-- HTML for the box -->
    <div class="box">?</div>
    <script>
      (function () {
        "use strict";
        /* global jQuery */

       //////////////////////////////////////////////////////////////////
        /////////////////// SETUP DO NOT DELETE //////////////////////////
        ////////////////////////////////////////////////////////////////// 

var box = jQuery(".box"); // reference to the HTML .box element
        var board = jQuery(".board"); // reference to the HTML .board element
        var boardWidth = board.width(); // the maximum X-Coordinate of the screen
        var boardHeight = jQuery(window).height();

        // update the boardWidth variable when the window is resized
        jQuery(window).on("resize", function () {
          boardWidth = board.width();
        });

        // Every 50 milliseconds, call the update Function (see below)
        var interval = setInterval(update, 50);

        // Every time the box is clicked, call the handleBoxClick Function (see below)
        box.on("click", handleBoxClick);
        board.on("click",endGame)

        // moves the Box to a new position on the screen along the X-Axis
        function moveBoxTo(newPositionX, newPositionY) {
          box.css("left", newPositionX);
          box.css("top", newPositionY);
        }

        // changes the text displayed on the Box
        function changeBoxText(newText) {
          box.text(newText);
        }


        
        //////////////////////////////////////////////////////////////////
        /////////////////// YOUR CODE BELOW HERE /////////////////////////
        //////////////////////////////////////////////////////////////////

        // TODO 2 - Variable declarations
       var positionX = 0
var points = 0
var speedX = 5
var positionY = 0
var speedY = 8
var randNum = Math.random() * 100;
var missClicks = 20
      

        /**
         * This Function will be called 20 times/second.
         * Each time it is called, it should move the Box to a new location.
         * If the box drifts off the screen, turn it around!
         */
       function update() { 
          moveBoxTo(positionX , positionY);
          positionX += speedX
          positionY += speedY
       if (positionX + 70 > boardWidth) {
       speedX *= -1
      }
      if (positionX < 0) {
        speedX *= -1
      }
        if (positionY + 70 > boardHeight) {
       speedY *= -1
      }
       if (positionY < 0) {
        speedY *= -1
      }
          
        }
          

        /**
         * This Function will be called each time the box is clicked.
         * Each time it is called, it should perform each of the following actions:
         * - increase the points total
         * - increase the speed
         * - move the box to the left side of the screen.
         */
       function handleBoxClick() {
          positionX = 0
          changeBoxText(points)
          points += 1
          speedX = (1.5 * points + 2) + 10
           speedY = (2 * points + 2) + 5




        }
        function endGame() {
          board.click = missClicks -= 1
          if (missClicks === 0){
           clearInterval(interval);
           alert("YOU LOSE. Refresh to play again")
}
        }
         


      })();
    </script>
  </body>
</html>
